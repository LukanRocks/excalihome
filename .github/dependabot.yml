# Generated by the repo-governance skill (scripts/dependabot-config.mjs) — regenerate instead of
# editing by hand whenever a workspace package or one of its dependencies is added or removed.
# options: --day friday --time 09:00 --timezone America/Sao_Paulo
version: 2
updates:
  - package-ecosystem: 'npm'
    # Root only: the pnpm workspace has a single lockfile. Per-directory entries update package.json but not
    # pnpm-lock.yaml, which breaks `pnpm install --frozen-lockfile`. Grouping by package gives one PR per scope.
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    # Matches pnpm-workspace.yaml minimumReleaseAge (2880 min); pnpm refuses anything newer.
    cooldown:
      default-days: 2
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      apps-backend:
        # apps/backend
        patterns:
          - '@types/archiver'
          - '@types/better-sqlite3'
          - '@types/express'
          - 'archiver'
          - 'better-sqlite3'
          - 'drizzle-kit'
          - 'drizzle-orm'
          - 'express'
          - 'express-rate-limit'
          - 'socket.io'
          - 'tsx'
      apps-web:
        # apps/web
        patterns:
          - '@base-ui/react'
          - '@excalidraw/excalidraw'
          - '@rolldown/plugin-babel'
          - '@tailwindcss/vite'
          - '@types/react'
          - '@types/react-dom'
          - '@vitejs/plugin-react'
          - 'babel-plugin-react-compiler'
          - 'class-variance-authority'
          - 'lucide-react'
          - 'react'
          - 'react-dom'
          - 'react-router-dom'
          - 'socket.io-client'
          - 'tailwind-merge'
          - 'tailwindcss'
          - 'vite'
      workspace-root:
        # root package.json
        patterns:
          - '@commitlint/cli'
          - '@commitlint/config-conventional'
          - 'husky'
          - 'lint-staged'
          - 'prettier'
          - 'prettier-plugin-tailwindcss'
      shared:
        # used by more than one package — one PR bumps it everywhere at once
        patterns:
          - '@types/node' # apps/backend, apps/web
          - 'typescript' # apps/backend, apps/web
      unscoped:
        # Dependencies added since this file was generated — regenerate to scope them.
        patterns:
          - '*'
        exclude-patterns:
          - '@types/archiver'
          - '@types/better-sqlite3'
          - '@types/express'
          - 'archiver'
          - 'better-sqlite3'
          - 'drizzle-kit'
          - 'drizzle-orm'
          - 'express'
          - 'express-rate-limit'
          - 'socket.io'
          - 'tsx'
          - '@base-ui/react'
          - '@excalidraw/excalidraw'
          - '@rolldown/plugin-babel'
          - '@tailwindcss/vite'
          - '@types/react'
          - '@types/react-dom'
          - '@vitejs/plugin-react'
          - 'babel-plugin-react-compiler'
          - 'class-variance-authority'
          - 'lucide-react'
          - 'react'
          - 'react-dom'
          - 'react-router-dom'
          - 'socket.io-client'
          - 'tailwind-merge'
          - 'tailwindcss'
          - 'vite'
          - '@commitlint/cli'
          - '@commitlint/config-conventional'
          - 'husky'
          - 'lint-staged'
          - 'prettier'
          - 'prettier-plugin-tailwindcss'
          - '@types/node'
          - 'typescript'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 2
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions:
        patterns:
          - '*'

  # ── Hand-maintained below this line ──
  # Not produced by dependabot-config.mjs: re-append this entry after regenerating the file above.
  # Keeps the digest-pinned node base image in the Dockerfile current.
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 2
    commit-message:
      prefix: 'build(deps)'
    ignore:
      # Stay on the Node 22 LTS line; move to a new major deliberately
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
